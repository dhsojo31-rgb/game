<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>OG 이미지 원본 (1200×630)</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif; color: #3b2a1a;
    background: #fff8e7; background-image: radial-gradient(circle at 10% 10%, rgba(246,197,67,0.35), transparent 45%), radial-gradient(circle at 90% 90%, rgba(47,111,222,0.22), transparent 45%); }
  .wrap { position: relative; width: 1200px; height: 630px; display: flex; align-items: center; justify-content: center; gap: 56px; }
  .moa { width: 250px; height: 333px; filter: drop-shadow(0 10px 12px rgba(70,40,10,.25)); }
  .text { display: flex; flex-direction: column; align-items: flex-start; }
  h1 { font-size: 92px; margin: 0; color: #6b4423; letter-spacing: 3px; line-height: 1.1; }
  h2 { font-size: 40px; margin: 10px 0 0; color: #1f4fa8; font-weight: 700; }
  p { font-size: 28px; margin: 22px 0 0; color: #6b5a48; }
  .strip { display: flex; align-items: center; gap: 18px; margin-top: 26px; background: rgba(255,255,255,.9); border: 3px solid #d9c7a8; border-radius: 999px; padding: 10px 28px; font-size: 24px; font-weight: 700; color: #6b4423; }
  .strip i { font-style: normal; font-size: 36px; }
  .dots { width: 36px; border-top: 5px dotted #c9a56a; }
  .books { position: absolute; bottom: 0; left: 0; right: 0; height: 26px; background: #6b4423; }
  .books::before { content: ""; position: absolute; left: 0; right: 0; bottom: 26px; height: 54px;
    background: repeating-linear-gradient(90deg, #d9534f 0 36px, #2f6fde 36px 64px, #f6c543 64px 104px, #2e9e5b 104px 134px, #f0893a 134px 160px, #8e5bd6 160px 200px); opacity: .85; }
</style>
</head>
<body>
<div class="wrap">
  <svg class="moa" viewBox="0 0 120 160" aria-hidden="true"><path d="M20 6h80v148l-40-28-40 28z" fill="#f6c543" stroke="#6b4423" stroke-width="5" stroke-linejoin="round"/><path d="M30 16h60v110l-30-21-30 21z" fill="#fff3c4"/><circle cx="45" cy="58" r="6" fill="#3b2a1a"/><circle cx="75" cy="58" r="6" fill="#3b2a1a"/><circle cx="47" cy="56" r="2" fill="#fff"/><circle cx="77" cy="56" r="2" fill="#fff"/><path d="M44 80q16 14 32 0" fill="none" stroke="#3b2a1a" stroke-width="4" stroke-linecap="round"/><circle cx="36" cy="74" r="5" fill="#f4a0a0" opacity=".8"/><circle cx="84" cy="74" r="5" fill="#f4a0a0" opacity=".8"/><circle cx="60" cy="112" r="10" fill="none" stroke="#2f6fde" stroke-width="4"/><path d="M67 119l10 10" stroke="#2f6fde" stroke-width="5" stroke-linecap="round"/></svg>
  <div class="text">
    <h1>책표지 탐정단</h1>
    <h2>사라진 이야기 열쇠</h2>
    <p>책 표지 속 단서를 찾아 출동! 독서교육 박람회 체험 게임</p>
    <div class="strip"><span><i>🧩</i> 퍼즐</span><span class="dots"></span><span><i>🔍</i> 틀린그림</span><span class="dots"></span><span><i>📚</i> 메모리</span><span class="dots"></span><span><i>🕵️</i> 숨은그림</span></div>
  </div>
  <div class="books"></div>
</div>
</body>
</html>
